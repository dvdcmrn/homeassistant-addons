name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check formatting with black
      run: |
        black --check --diff .
    
    - name: Type check with mypy
      run: |
        mypy custom_components/dvdcmrn_icons/ --ignore-missing-imports
    
    - name: Test with pytest
      run: |
        pytest tests/ -v

  validate-integration:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install Home Assistant
      run: |
        python -m pip install --upgrade pip
        pip install homeassistant
    
    - name: Validate integration structure
      run: |
        # Check if all required files exist
        test -f custom_components/dvdcmrn_icons/__init__.py
        test -f custom_components/dvdcmrn_icons/manifest.json
        test -f custom_components/dvdcmrn_icons/services.yaml
        
        # Validate manifest.json
        python -c "import json; json.load(open('custom_components/dvdcmrn_icons/manifest.json'))"
        
        echo "✅ Integration structure is valid" 