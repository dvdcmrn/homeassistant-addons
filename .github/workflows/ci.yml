name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check formatting with black
      run: |
        black --check --diff .

    - name: Type check with mypy
      run: |
        mypy custom_components/cupertino_icons/ --ignore-missing-imports

    - name: Test with pytest
      run: |
        pytest tests/ -v

  validate-integration:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Home Assistant
      run: |
        python -m pip install --upgrade pip
        pip install homeassistant

    - name: Validate integration structure
      run: |
        test -f hacs.json
        test -f brand/icon.png
        test -f custom_components/cupertino_icons/brand/icon.png
        test -f custom_components/cupertino_icons/__init__.py
        test -f custom_components/cupertino_icons/manifest.json
        test -f custom_components/cupertino_icons/services.yaml
        test -f custom_components/cupertino_icons/icon_manager.py
        test -f custom_components/cupertino_icons/iconset.js
        python -c "import json; json.load(open('custom_components/cupertino_icons/manifest.json'))"
        test -f repository.yaml
        test -f addons/oled_display/config.yaml
        echo "Integration and add-on layout checks passed"

  hacs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: HACS validation
      uses: hacs/action@main
      continue-on-error: true
      with:
        category: integration
